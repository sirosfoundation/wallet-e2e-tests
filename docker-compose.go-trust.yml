# Docker Compose override for testing with go-trust PDP
#
# Use this to test with the real go-trust AuthZEN PDP instead of the mock PDP.
#
# Usage:
#   docker-compose -f docker-compose.test.yml -f docker-compose.go-trust.yml up -d
#   make test-trust-integration
#
# This replaces mock-trust-pdp with the actual go-trust implementation.

services:
  # Go Trust PDP - AlwaysTrusted registry for testing
  # Replace mock-trust-pdp with actual go-trust
  go-trust-allow:
    build:
      context: ${GO_TRUST_PATH:-../go-trust}
      dockerfile: Dockerfile
    image: go-trust-e2e-test:local
    container_name: go-trust-allow-e2e-test
    ports:
      - "9091:6001"  # Map mock-trust-pdp port to go-trust
    command: ["--mode", "static:always-trusted", "--host", "0.0.0.0", "--port", "6001"]
    environment:
      - GO_TRUST_EXTERNAL_URL=http://localhost:9091
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6001/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-test-network

  # Go Trust PDP - NeverTrusted registry for testing rejection
  go-trust-deny:
    build:
      context: ${GO_TRUST_PATH:-../go-trust}
      dockerfile: Dockerfile  
    image: go-trust-e2e-test:local
    container_name: go-trust-deny-e2e-test
    ports:
      - "9092:6001"
    command: ["--mode", "static:never-trusted", "--host", "0.0.0.0", "--port", "6001"]
    environment:
      - GO_TRUST_EXTERNAL_URL=http://localhost:9092
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6001/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-test-network

  # Override wallet-backend to use go-trust-allow by default
  wallet-backend:
    environment:
      - WALLET_TRUST_PDP_URL=http://localhost:9091

networks:
  e2e-test-network:
    driver: bridge
